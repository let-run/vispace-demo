name: Deploy ViSpace demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the demo repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v5

      - name: Upload demo Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
